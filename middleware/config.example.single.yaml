# =============================================================
# SpoolSense NFC Middleware — Configuration (Single Toolhead)
# =============================================================
# Copy this file to ~/SpoolSense/config.yaml and fill in your values.
#
#   cp config.example.single.yaml ~/SpoolSense/config.yaml
#
# This config is for single-toolhead printers (one extruder, one
# scanner). On every scan, SET_ACTIVE_SPOOL is called directly
# via Moonraker and the spool ID is saved to Klipper variables.
# =============================================================

# ---- MQTT Broker --------------------------------------------
mqtt:
  broker: "YOUR_HOME_ASSISTANT_IP"    # e.g. "192.168.1.100"
  port: 1883
  username: "your_mqtt_username"
  password: "your_mqtt_password"

# ---- Spoolman URL (optional) -------------------------------
spoolman_url: "http://YOUR_SPOOLMAN_IP:7912"

# ---- Moonraker URL ------------------------------------------
moonraker_url: "http://YOUR_KLIPPER_IP"

# ---- Low Spool Threshold ------------------------------------
low_spool_threshold: 100

# ---- Scanners ------------------------------------------------
# Single scanner assigned to the one toolhead.
scanners:
  "YOUR_DEVICE_ID":
    action: "toolhead"
    toolhead: "T0"

scanner_topic_prefix: "spoolsense"

# ---- Event publishing (optional) ----------------------------
# Every scan/activation is published as JSON to spoolsense/events/<action>
# for Home Assistant automations. On by default; uncomment to disable.
# publish_events: false

# ---- Tag Writeback (optional) ------------------------------
# tag_writeback_enabled: false
