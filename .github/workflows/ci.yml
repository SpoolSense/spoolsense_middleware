name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 = Raspberry Pi OS (Bullseye) floor; 3.12 = current
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: middleware/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r middleware/requirements-dev.txt

      - name: Lint (syntax errors and undefined names only)
        run: flake8 middleware/ --count --select=E9,F63,F7,F82 --show-source --exclude=middleware/docs

      - name: Test
        run: pytest middleware/tests/ -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f docker/Dockerfile -t spoolsense-middleware .

      - name: Smoke test — missing config seeds examples and exits with instructions
        run: |
          set +e
          OUT=$(docker run --rm -v /tmp/ssdata-empty:/home/spoolsense/SpoolSense spoolsense-middleware 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          test $CODE -ne 0
          echo "$OUT" | grep -q "No config.yaml found"
          sudo test -f /tmp/ssdata-empty/config.example.single.yaml

      - name: Smoke test — --check-config passes with a valid config
        run: |
          mkdir -p /tmp/ssdata
          cat > /tmp/ssdata/config.yaml <<'YAML'
          mqtt:
            broker: 127.0.0.1
          moonraker_url: http://127.0.0.1:7125
          scanners:
            aabbcc:
              action: toolhead_stage
          YAML
          docker run --rm -v /tmp/ssdata:/home/spoolsense/SpoolSense spoolsense-middleware python middleware/spoolsense.py --check-config
